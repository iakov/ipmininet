name: Test IPMininet
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Mininet dependency must be mimi-net fork
        run: grep -q 'mimi-net/mininet' pyproject.toml || (echo "mininet dependency must point to mimi-net/mininet.git fork" && exit 1)
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github
      - run: uv run mdformat --check .
      - name: No noqa or type:ignore in .py files
        run: |
          if [ "$(grep -rn '# noqa' ipmininet --include='*.py' | grep -v '__init__.py' | wc -l)" -ne 0 ]; then echo "Found # noqa outside __init__.py"; exit 1; fi
          if grep -rn '# type: ignore' ipmininet --include='*.py'; then echo "Found # type: ignore comments"; exit 1; fi
      - name: Coverage configs must be identical
        run: diff .coveragerc ipmininet/.coveragerc || (echo ".coveragerc and ipmininet/.coveragerc must be identical" && exit 1)

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache test container
        uses: docker/build-push-action@v6
        with:
          file: Containerfile
          target: final
          push: false
          load: true
          tags: ipmininet-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run core tests with coverage
        run: |
          docker run --rm --privileged \
            -v $PWD:/workspace:Z \
            ipmininet-dev \
            sudo env "PATH=$PATH" .tmp/ci-test.sh \
              ipmininet/tests/test_address_alllocation.py \
              ipmininet/tests/test_cli.py \
              ipmininet/tests/test_misc.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/